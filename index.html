<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWOT-қадам / SWOT-шаг — Ой жазу / Добавить мысль</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 55%, #F8FAFC 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="text-slate-800 flex items-center justify-center p-4">

  <div class="w-full max-w-lg bg-white/95 backdrop-blur-md border border-sky-100 rounded-3xl p-6 sm:p-8 shadow-xl shadow-sky-900/5">

    <!-- Тақырып -->
    <div class="text-center mb-6">
      <span class="inline-block px-3 py-1 rounded-full bg-sky-50 border border-sky-200 text-sky-700 text-xs font-semibold mb-2">
        SWOT-қадам • SWOT-шаг
      </span>
      <h1 class="text-2xl font-bold text-slate-900">Рефлексия / Рефлексия</h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-1">
        Топты таңдап, ойыңызды жазыңыз<br />
        <span class="text-xs text-slate-400">Выберите группу и напишите мысль</span>
      </p>
    </div>

    <!-- Топ аты / Название группы -->
    <div class="mb-5">
      <label class="block text-xs font-bold text-slate-700 mb-1.5">
        Топ аты / Название группы
      </label>
      <select id="groupSelect"
        class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm font-semibold text-slate-800 focus:outline-none focus:border-sky-500 focus:bg-white transition">
        <option value="1-топ / Группа 1">1-топ / Группа 1</option>
        <option value="2-топ / Группа 2">2-топ / Группа 2</option>
      </select>
    </div>

    <!-- Жазба #1 -->
    <div id="firstEntry" data-entry class="p-4 rounded-2xl bg-slate-50/90 border border-slate-200 space-y-3 mb-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-slate-600">Жазба / Запись #1</span>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">
          Есіміңіз / Ваше имя
        </label>
        <input type="text" data-field="name" placeholder="Есіміңіз / Ваше имя..."
          class="w-full px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-sm focus:outline-none focus:border-sky-500 transition" />
      </div>

      <div class="bg-emerald-50/70 border border-emerald-200/80 rounded-xl p-3">
        <label class="block text-xs font-bold text-emerald-900 mb-1">
          Күшті жақтары / Сильные стороны
        </label>
        <input type="text" data-field="strength" maxlength="140" placeholder="Күшті жағын жазыңыз / Сильные стороны..."
          class="w-full px-3 py-2 rounded-lg bg-white border border-emerald-200 text-sm focus:outline-none focus:border-emerald-500 transition" />
      </div>

      <div class="bg-amber-50/70 border border-amber-200/80 rounded-xl p-3">
        <label class="block text-xs font-bold text-amber-950 mb-1">
          Жақсартатын тұстары / Зоны улучшения
        </label>
        <input type="text" data-field="improvement" maxlength="140" placeholder="Жақсартатын тұсын жазыңыз / Что улучшить..."
          class="w-full px-3 py-2 rounded-lg bg-white border border-amber-200 text-sm focus:outline-none focus:border-amber-500 transition" />
      </div>
    </div>

    <!-- Жазба 1-ден кейінгі Жазба қосу батырмасы -->
    <button type="button" onclick="addEntryRow()"
      class="w-full py-3 px-4 rounded-xl bg-sky-50 hover:bg-sky-100 border border-sky-200 text-sky-700 font-semibold text-sm transition flex items-center justify-center gap-2 mb-4">
      <span class="text-lg leading-none">+</span>
      <span>Жазба қосу / Добавить запись</span>
    </button>

    <!-- Қосымша жазбалар осында ашылады -->
    <div id="extraEntries" class="space-y-4 mb-6"></div>

    <!-- Жіберу батырмасы -->
    <button id="submitBtn" type="button" onclick="sendEntries()"
      class="w-full py-3.5 rounded-2xl bg-sky-600 hover:bg-sky-700 active:scale-[0.99] text-white font-semibold text-sm shadow-lg shadow-sky-600/20 transition">
      Тақтаға жіберу / Отправить на доску
    </button>

    <div id="statusMsg" class="hidden mt-4 p-3 rounded-2xl text-center text-sm font-medium"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyoam6B-OAuNZNMSdM4RP-aXWiOuxAY8hRaKKMeE6qXHMMBK8FYdA3AJtKIe95SOMZfJg/exec";

    let entryCount = 1;

    function addEntryRow() {
      entryCount++;
      const container = document.getElementById('extraEntries');
      const card = document.createElement('div');
      card.id = `entry-${entryCount}`;
      card.setAttribute('data-entry', 'true');
      card.className = "p-4 rounded-2xl bg-slate-50/90 border border-slate-200 space-y-3";

      card.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-600">Жазба / Запись #${entryCount}</span>
          <button type="button" onclick="removeRow('${card.id}')" class="text-xs text-rose-600 hover:underline">
            Өшіру / Удалить
          </button>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">
            Есіміңіз / Ваше имя
          </label>
          <input type="text" data-field="name" placeholder="Есіміңіз / Ваше имя..."
            class="w-full px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-sm focus:outline-none focus:border-sky-500 transition" />
        </div>

        <div class="bg-emerald-50/70 border border-emerald-200/80 rounded-xl p-3">
          <label class="block text-xs font-bold text-emerald-900 mb-1">
            Күшті жақтары / Сильные стороны
          </label>
          <input type="text" data-field="strength" maxlength="140" placeholder="Күшті жағын жазыңыз / Сильные стороны..."
            class="w-full px-3 py-2 rounded-lg bg-white border border-emerald-200 text-sm focus:outline-none focus:border-emerald-500 transition" />
        </div>

        <div class="bg-amber-50/70 border border-amber-200/80 rounded-xl p-3">
          <label class="block text-xs font-bold text-amber-950 mb-1">
            Жақсартатын тұстары / Зоны улучшения
          </label>
          <input type="text" data-field="improvement" maxlength="140" placeholder="Жақсартатын тұсын жазыңыз / Что улучшить..."
            class="w-full px-3 py-2 rounded-lg bg-white border border-amber-200 text-sm focus:outline-none focus:border-amber-500 transition" />
        </div>
      `;

      container.appendChild(card);
    }

    function removeRow(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    async function sendEntries() {
      const group = document.getElementById('groupSelect').value;
      const cards = document.querySelectorAll('[data-entry]');
      const statusMsg = document.getElementById('statusMsg');
      const btn = document.getElementById('submitBtn');

      const entries = [];
      cards.forEach(card => {
        const name = (card.querySelector('[data-field="name"]')?.value || '').trim() || 'Анонимді / Анонимно';
        const strength = (card.querySelector('[data-field="strength"]')?.value || '').trim();
        const improvement = (card.querySelector('[data-field="improvement"]')?.value || '').trim();

        if (strength || improvement) {
          entries.push({ name, strength, improvement });
        }
      });

      if (entries.length === 0) {
        statusMsg.className = "mt-4 p-3 rounded-2xl text-center text-sm font-medium bg-amber-50 text-amber-800 border border-amber-200";
        statusMsg.textContent = "Кемінде бір ой жазыңыз / Напишите хотя бы одну мысль.";
        statusMsg.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = "Жіберілуде... / Отправка...";

      const timeStr = new Date().toLocaleTimeString('kk-KZ', { hour: '2-digit', minute: '2-digit' });

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            time: timeStr,
            group: group,
            entries: entries
          })
        });

        document.querySelector('#firstEntry [data-field="name"]').value = '';
        document.querySelector('#firstEntry [data-field="strength"]').value = '';
        document.querySelector('#firstEntry [data-field="improvement"]').value = '';
        document.getElementById('extraEntries').innerHTML = '';
        entryCount = 1;

        statusMsg.className = "mt-4 p-3 rounded-2xl text-center text-sm font-medium bg-emerald-50 text-emerald-800 border border-emerald-200";
        statusMsg.textContent = "✓ Тақтаға сәтті жіберілді! / Успешно отправлено на доску!";
        statusMsg.classList.remove('hidden');
      } catch (e) {
        statusMsg.className = "mt-4 p-3 rounded-2xl text-center text-sm font-medium bg-rose-50 text-rose-700 border border-rose-200";
        statusMsg.textContent = "Қате шықты / Ошибка отправки.";
        statusMsg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = "Тақтаға жіберу / Отправить на доску";
      }
    }
  </script>
</body>
</html>
